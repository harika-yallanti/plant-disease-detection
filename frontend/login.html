<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PlantCare AI | Login</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <h1>🌿 PlantCare AI</h1>

            <p class="login-subtitle">
                Plant Disease Detection
            </p>


            <!-- Login Form -->

            <div id="loginForm">

                <h2>Login</h2>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    autocomplete="username"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    id="loginButton"
                >
                    Login
                </button>


                <p id="loginError"
                   class="auth-message">
                </p>


                <p class="switch-text">
                    Don't have an account?
                    <button
                        id="showRegister"
                        class="link-button"
                    >
                        Register
                    </button>
                </p>

            </div>


            <!-- Register Form -->

            <div id="registerForm"
                 class="hidden">

                <h2>Create Account</h2>

                <input
                    type="email"
                    id="registerEmail"
                    name="registerEmail"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    name="new-password"
                    autocomplete="new-password"
                    placeholder="Create a password"
                    required
                >

                <button
                    id="registerButton"
                >
                    Register
                </button>


                <p id="registerError"
                   class="auth-message">
                </p>


                <p class="switch-text">
                    Already have an account?
                    <button
                        id="showLogin"
                        class="link-button"
                    >
                        Login
                    </button>
                </p>

            </div>

        </div>

    </div>


    <!-- Firebase Authentication -->

    <script
        type="module"
        src="auth.js">
    </script>

</body>

</html>
